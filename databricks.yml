# Databricks Asset Bundle: deploys the notebooks as jobs to dev, uat and prod.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev            # the dev workspace, same names as uat/prod
#   databricks bundle run      -t dev study_benchmark
#
# uat and prod are deployed by CI (.github/workflows/deploy.yml) as a service
# principal. Per-environment settings are variables below; override any of them
# with --var name=value or BUNDLE_VAR_<name>. Guide: docs/deployment.md.
#
# Personal learning project; synthetic data only in every target until the
# real-data path is approved. See DISCLAIMER.md.

bundle:
  name: dental-omop-nlp

include:
  - databricks/resources/*.yml

variables:
  # dev, uat and prod are separate workspaces, so the names are the same in every
  # target: catalog dental_omop, schemas landing_/bronze_/silver_/gold_<domain>
  # (databricks/resources/unity_catalog.yml).
  catalog:
    description: Unity Catalog catalog the bundle creates
    default: dental_omop
  domain:
    description: Suffix of the layer schemas (landing_, bronze_, silver_, gold_)
    default: dental_omop_perio
  n_people:
    description: Synthetic people to generate in the benchmark job
    default: "300"
  run_encoder:
    description: Fine-tune the DistilBERT rung in the benchmark job (installs CPU torch; adds ~10 min)
    default: "false"
  judge_endpoint:
    description: Model Serving endpoint for the LLM judge (approved for de-identified data)
    default: none
  judge_usd_per_million_in:
    description: Judge endpoint list price, US$ per 1M input tokens (Llama 3.3 70B pay-per-token 7.143 DBU x US$0.07; check your account's rate)
    default: "0.50"
  judge_usd_per_million_out:
    description: Judge endpoint list price, US$ per 1M output tokens (21.429 DBU x US$0.07)
    default: "1.50"
  judge_sample_rate:
    description: Share of live traces the LLM judges score in production monitoring (the PHI scan scores all)
    default: "0.1"
  warehouse_name:
    description: SQL warehouse that runs the ai_query judge notebook
    default: Serverless Starter Warehouse
  warehouse_id:
    description: Looked up from warehouse_name
    lookup:
      warehouse: ${var.warehouse_name}
  reader_rung:
    description: LLM note-reader rung from models.yaml
    default: medgemma-1.5-4b-it
  reader_limit:
    description: Review notes the reader job processes (0 = all)
    default: "40"
  hf_secret_scope:
    description: Secret scope holding hf_token (Hugging Face read token; HAI-DEF terms accepted)
    default: dental
  lakebase_instance:
    description: Lakebase (managed Postgres) instance or project for this environment
    default: dental-dev
  lakebase_database:
    description: Postgres database inside the Lakebase instance
    default: databricks_postgres
  lakebase_schema:
    description: Schema for the OMOP CDM + dental extension in Lakebase
    default: cdm_dev
  encoder_gpu_rungs:
    description: Encoders the GPU job fine-tunes (spec 002 T017)
    default: modernbert-large,bioclinical-modernbert-large,longformer-base,clinical-longformer,gatortron-base
  encoder_gpu_lr:
    description: Learning-rate overrides for the GPU job, rung=rate (GatorTron-base diverged at 5e-5 on CPU)
    default: gatortron-base=2e-5
  gpu_node_type:
    description: GPU node type for the MedGemma job (uat/prod only)
    default: g5.2xlarge
  gpu_spark_version:
    description: ML runtime with GPU support for the MedGemma job
    default: 16.4.x-gpu-ml-scala2.12
  service_principal:
    description: Application id of the service principal that runs uat/prod jobs
    default: "00000000-0000-0000-0000-000000000000"
  users_group:
    description: Workspace group that may view and run the jobs
    default: users

targets:
  # The dev workspace (e.g. Databricks Free Edition). Not `mode: development`: that
  # prefixes every name ([dev <user>] jobs, dev_<user>_ catalogs and schemas), and
  # the workspace already separates environments. Names are the same in every
  # target. Schedules stay paused; everything is serverless.
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
    variables:
      judge_endpoint: databricks-meta-llama-3-3-70b-instruct   # pay-per-token; synthetic, de-identified notes only
    resources:
      catalogs:
        dental_omop:
          # dev has Default Storage: the catalog was made with SQL and adopted (docs/deployment.md), which
          # gives it the workspace's default storage root. Stating it keeps the plan from recreating the catalog.
          storage_root: s3://dbstorage-prod-ast0p/uc/556de223-f832-4c59-8269-f8bebde9a978/71a2bfe2-25ec-4dde-ad73-b6f34409fcef

  # Shared test environment. Deployed by CI from main, runs as the service principal.
  uat:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
    variables:
      n_people: "1500"
      run_encoder: "true"
      lakebase_instance: dental-uat
      lakebase_schema: cdm
    permissions:
      - group_name: ${var.users_group}
        level: CAN_VIEW
    resources:
      jobs:
        judge_monitoring: &judge_monitoring_job
          name: dental-omop-nlp LLM judge monitoring (${bundle.target})
          tags:
            project: dental-omop-nlp
            data: synthetic
          tasks:
            - task_key: start_monitoring
              notebook_task:
                notebook_path: databricks/notebooks/05_judge_monitoring.py
                base_parameters:
                  judge_endpoint: ${var.judge_endpoint}
                  experiment_id: ${resources.experiments.dental_experiment.id}
                  sample_rate: ${var.judge_sample_rate}
        medgemma_reader: &medgemma_job
          name: dental-omop-nlp medgemma reader (${bundle.target})
          job_clusters:
            - job_cluster_key: gpu
              new_cluster:
                spark_version: ${var.gpu_spark_version}
                node_type_id: ${var.gpu_node_type}
                num_workers: 0
                spark_conf:
                  spark.databricks.cluster.profile: singleNode
                  spark.master: local[*]
                custom_tags:
                  ResourceClass: SingleNode
                  project: dental-omop-nlp
          tasks:
            - task_key: read_notes
              job_cluster_key: gpu
              notebook_task:
                notebook_path: databricks/notebooks/03_medgemma_reader.py
                base_parameters:
                  catalog: ${resources.schemas.gold.catalog_name}
                  schema: ${resources.schemas.gold.name}
                  rung: ${var.reader_rung}
                  limit: ${var.reader_limit}
                  shots: "0"
                  hf_secret_scope: ${var.hf_secret_scope}
        encoder_gpu: &encoder_gpu_job
          name: dental-omop-nlp encoders on GPU (${bundle.target})
          tags:
            project: dental-omop-nlp
            data: synthetic
          job_clusters:
            - job_cluster_key: gpu
              new_cluster:
                spark_version: ${var.gpu_spark_version}
                node_type_id: ${var.gpu_node_type}
                num_workers: 0
                spark_conf:
                  spark.databricks.cluster.profile: singleNode
                  spark.master: local[*]
                custom_tags:
                  ResourceClass: SingleNode
                  project: dental-omop-nlp
          tasks:
            - task_key: fine_tune_and_predict
              job_cluster_key: gpu
              notebook_task:
                notebook_path: databricks/notebooks/08_encoder_gpu.py
                base_parameters:
                  rungs: ${var.encoder_gpu_rungs}
                  lr_overrides: ${var.encoder_gpu_lr}
                  catalog: ${resources.schemas.gold.catalog_name}
                  schema: ${resources.schemas.gold.name}
                  landing_schema: ${resources.volumes.data.schema_name}

  # Production. Manual deploy from a tagged commit, approval required in CI.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
    variables:
      run_encoder: "true"
      lakebase_instance: dental-prod
      lakebase_schema: cdm
      n_people: "1500"
      reader_limit: "0"
    permissions:
      - group_name: ${var.users_group}
        level: CAN_VIEW
    resources:
      jobs:
        judge_monitoring: *judge_monitoring_job
        medgemma_reader: *medgemma_job
        encoder_gpu: *encoder_gpu_job
