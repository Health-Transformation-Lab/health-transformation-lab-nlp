# Overrides for Synthea's default synthea.properties. Only keys that differ
# from the default are listed; everything else falls through.

# Custom dental modules live in the repo, not in the jar.
generate.local_modules_dir = synthea/modules

# Keep records small: we only need encounters, conditions, procedures,
# observations/measurements. Everything else is noise for this benchmark.
exporter.csv.included_files = patients.csv,encounters.csv,conditions.csv,procedures.csv,observations.csv,providers.csv,organizations.csv

# Dental data is tooth-level and observation-heavy; let the generator keep
# every observation rather than only the latest per encounter.
exporter.csv.append_mode = false
exporter.split_records = false

# Age range: perio staging is for adults.
generate.demographics.default_min_age = 18
generate.demographics.default_max_age = 85
