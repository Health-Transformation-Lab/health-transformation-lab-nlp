# Unity Catalog objects the bundle owns (docs/deployment.md): one catalog, one
# schema per bench and layer (spec 019), and the landing volume the jobs write files to.
#
#   dental_omop                       catalog
#     landing_perio_bench             volumes (data: generated CSV/parquet, run files)
#     bronze_perio_bench              raw tables       (empty for now)
#     silver_perio_bench              cleaned tables   (empty for now)
#     gold_perio_bench                study tables, results, perio_note_classifier
#     bronze_/silver_/gold_access_bench        empty for now
#     bronze_/silver_/gold_oral_health_bench   empty for now
#
# Legacy (spec 019): the old <layer>_${var.legacy_domain} schemas and their data volume keep their old
# keys (landing, bronze, silver, gold, data) so a deploy neither fails on prevent_destroy nor drops them.
# The Load results job copies them into perio_bench; retire them by hand afterwards (docs/deployment.md).
#
# Each target is its own workspace, so the names are the same everywhere, with no
# dev_ prefix (the dev target is not in development mode). Jobs reference these
# resources so a deploy creates them before anything writes to them.
#
# prevent_destroy: `bundle destroy` must never drop a catalog, schema or volume
# with data in it. Remove one by hand if you really mean to.
# Needs Databricks CLI >= 0.288 (catalogs resource), CREATE CATALOG on the
# metastore for whoever deploys, and the target's admin group: both come from
# databricks/setup/create_service_principal.sh.

resources:
  catalogs:
    dental_omop:
      name: ${var.catalog}
      comment: Dental OMOP. Synthetic data only.
      grants:   # the group databricks/setup/create_service_principal.sh makes (you and the principal)
        - principal: dental_omop_nlp_${bundle.target}_admin
          privileges: [ALL_PRIVILEGES]
      lifecycle:
        prevent_destroy: true

  schemas:
    landing:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: landing_${var.legacy_domain}
      comment: Legacy (spec 019), moved to landing_perio_bench. Landing zone (volumes) for ${var.legacy_domain}. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    bronze:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: bronze_${var.legacy_domain}
      comment: Legacy (spec 019), moved to bronze_perio_bench. Raw tables for ${var.legacy_domain}. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    silver:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: silver_${var.legacy_domain}
      comment: Legacy (spec 019), moved to silver_perio_bench. Cleaned tables for ${var.legacy_domain}. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    gold:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: gold_${var.legacy_domain}
      comment: Legacy (spec 019), moved to gold_perio_bench. Study tables, results and perio_note_classifier for ${var.legacy_domain}. Synthetic data only.
      lifecycle:
        prevent_destroy: true

    perio_bench_landing:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: landing_perio_bench
      comment: Landing zone (volumes) for perio_bench. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    perio_bench_bronze:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: bronze_perio_bench
      comment: Raw tables for perio_bench. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    perio_bench_silver:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: silver_perio_bench
      comment: Cleaned tables for perio_bench. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    perio_bench_gold:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: gold_perio_bench
      comment: Study tables, results and perio_note_classifier for perio_bench. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    access_bench_bronze:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: bronze_access_bench
      comment: Raw tables for access_bench; empty until it has a pipeline. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    access_bench_silver:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: silver_access_bench
      comment: Cleaned tables for access_bench; empty until it has a pipeline. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    access_bench_gold:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: gold_access_bench
      comment: Study tables and results for access_bench; empty until it has a pipeline. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    oral_health_bench_bronze:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: bronze_oral_health_bench
      comment: Raw tables for oral_health_bench; empty until it has a pipeline. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    oral_health_bench_silver:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: silver_oral_health_bench
      comment: Cleaned tables for oral_health_bench; empty until it has a pipeline. Synthetic data only.
      lifecycle:
        prevent_destroy: true
    oral_health_bench_gold:
      catalog_name: ${resources.catalogs.dental_omop.name}
      name: gold_oral_health_bench
      comment: Study tables and results for oral_health_bench; empty until it has a pipeline. Synthetic data only.
      lifecycle:
        prevent_destroy: true

  volumes:
    perio_bench_data:
      catalog_name: ${resources.schemas.perio_bench_landing.catalog_name}
      schema_name: ${resources.schemas.perio_bench_landing.name}
      name: data
      volume_type: MANAGED
      comment: Files the pipeline writes (DENTAL_DATA_ROOT). Synthetic data only.
      lifecycle:
        prevent_destroy: true
    data:   # legacy (spec 019): the old landing volume, copied to perio_bench_data
      catalog_name: ${resources.schemas.landing.catalog_name}
      schema_name: ${resources.schemas.landing.name}
      name: data
      volume_type: MANAGED
      comment: Files the pipeline writes (DENTAL_DATA_ROOT). Synthetic data only.
      lifecycle:
        prevent_destroy: true
