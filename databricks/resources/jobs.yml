# Jobs deployed to every target. Notebook tasks without a cluster run on
# serverless compute (the only option on Free Edition). The MedGemma GPU job is
# defined per target in databricks.yml (uat/prod); in dev, run
# databricks/notebooks/03_medgemma_reader.py interactively on serverless GPU.

resources:
  jobs:
    study_benchmark:
      name: dental-omop-nlp study + benchmark (${bundle.target})
      tags:
        project: dental-omop-nlp
        data: synthetic
      tasks:
        - task_key: build_and_benchmark
          notebook_task:
            notebook_path: ../notebooks/01_run_benchmark.py
            base_parameters:
              catalog: ${resources.schemas.gold.catalog_name}
              schema: ${resources.schemas.gold.name}
              landing_schema: ${resources.volumes.data.schema_name}
              n_people: ${var.n_people}
              run_encoder: ${var.run_encoder}
              leak_assessment: "false"
              experiment: ${resources.experiments.dental_experiment.name}

    load_lakebase:
      name: dental-omop-nlp load OMOP into Lakebase (${bundle.target})
      tags:
        project: dental-omop-nlp
        data: synthetic
      tasks:
        - task_key: load
          notebook_task:
            notebook_path: ../notebooks/04_load_lakebase.py
            base_parameters:
              lakebase_instance: ${var.lakebase_instance}
              lakebase_database: ${var.lakebase_database}
              lakebase_schema: ${var.lakebase_schema}
              secret_scope: ${var.hf_secret_scope}

    llm_judge:
      name: dental-omop-nlp LLM judge via ai_query (${bundle.target})
      tags:
        project: dental-omop-nlp
        data: synthetic
      tasks:
        - task_key: judge
          notebook_task:
            notebook_path: ../notebooks/02_llm_judge.sql
            warehouse_id: ${var.warehouse_id}
            base_parameters:
              catalog: ${resources.schemas.gold.catalog_name}
              schema: ${resources.schemas.gold.name}
              judge_endpoint: ${var.judge_endpoint}
