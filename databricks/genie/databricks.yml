# Genie spaces for the two graders (spec 019 US5), a bundle of their own (issue #155): a space can't be created
# before the tables it reads, and the Load results job writes those tables after the main bundle deploys. The deploy
# workflow deploys this bundle last, and only once every table the spaces read exists
# (.github/scripts/genie_tables_missing.py); a deploy that finds one missing skips, and the next one creates them.
#
# The spaces are built by python/scripts/42_build_dashboards.py, so each defines its measures exactly as its
# dashboard does. Needs Databricks CLI 1.3.0 or later and the direct engine (DATABRICKS_BUNDLE_ENGINE=direct).
#
#   cd databricks/genie && databricks bundle validate -t dev

bundle:
  name: health-transformation-lab-genie

variables:
  # The same warehouse the main bundle (../../databricks.yml) uses; a bundle can't read another's variables.
  warehouse_name:
    description: SQL warehouse the Genie spaces query (as warehouse_name in the main bundle)
    default: Serverless Starter Warehouse
  warehouse_id:
    description: Looked up from warehouse_name
    lookup:
      warehouse: ${var.warehouse_name}

resources:
  genie_spaces:
    dq_grader_genie:
      title: EHR DQ grader
      description: Data quality of the synthetic dental record for periodontal phenotyping. Synthetic data only.
      warehouse_id: ${var.warehouse_id}
      file_path: ./dq_grader.geniespace.json
    lab_grader_genie:
      title: Lab grader
      description: AI answers on medical-dental and access-to-care questions, with and without an open agent. A SIMULATED sample until real runs exist.
      warehouse_id: ${var.warehouse_id}
      file_path: ./lab_grader.geniespace.json

targets:
  # Each target is its own workspace, as in the main bundle; names are the same everywhere.
  dev:
    default: true
  uat:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
