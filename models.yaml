# Model registry for the dental-notes periodontal classification benchmark.
# Source: model evaluation sheet (Oct 2026), 12 candidates.
# Every model here is run through the same scorer (eval/) on the same
# patient-level test split, in both the Python and R pipelines.
#
# role:
#   classifier  - fine-tune with a sequence-classification head -> perio status
#   long_context - classifier that can take a whole chart / multi-visit note set
#   entity_linking - maps note terms to UMLS/SNOMED concepts (feeds OMOP mapping,
#                    not a direct classifier)
#   retrieval   - late-interaction retriever; used for RAG / evidence lookup,
#                 not fine-tuned as a classifier
#
# max_len is the model's native context length in tokens.

models:

  # ---- general-domain baselines -------------------------------------------
  - id: bert-base
    hf: google-bert/bert-base-uncased
    org: Google
    year: 2018
    domain: general
    role: classifier
    max_len: 512
    paper: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"
    paper_url: https://arxiv.org/abs/1810.04805

  - id: distilbert-base
    hf: distilbert/distilbert-base-uncased
    org: Hugging Face
    year: 2019
    domain: general
    role: classifier
    max_len: 512
    paper: "DistilBERT, a distilled version of BERT: smaller, faster, cheaper and lighter"
    paper_url: https://arxiv.org/abs/1910.01108
    note: >
      Sheet links distilbert-base-uncased-finetuned-sst-2-english, which is the
      SST-2 sentiment fine-tune. Use the base checkpoint above for our own
      fine-tune; the sentiment head is not a useful starting point.

  - id: modernbert-base
    hf: answerdotai/ModernBERT-base
    org: Answer.AI
    year: 2024
    domain: general
    role: long_context
    max_len: 8192
    paper: "Smarter, Better, Faster, Longer: A Modern Bidirectional Encoder for Fast, Memory Efficient, and Long Context Finetuning and Inference"
    paper_url: https://arxiv.org/abs/2412.13663

  - id: modernbert-large
    hf: answerdotai/ModernBERT-large
    org: Answer.AI
    year: 2024
    domain: general
    role: long_context
    max_len: 8192
    paper: "Smarter, Better, Faster, Longer (ModernBERT)"
    paper_url: https://arxiv.org/abs/2412.13663

  - id: longformer-base
    hf: allenai/longformer-base-4096
    org: Allen Institute for AI
    year: 2020
    domain: general
    role: long_context
    max_len: 4096
    paper: "Longformer: The Long-Document Transformer"
    paper_url: https://arxiv.org/abs/2004.05150

  # ---- scientific / biomedical ---------------------------------------------
  - id: scibert
    hf: allenai/scibert_scivocab_uncased
    org: Allen Institute for AI
    year: 2019
    domain: scientific
    role: classifier
    max_len: 512
    paper: "SciBERT: A Pretrained Language Model for Scientific Text"
    paper_url: https://arxiv.org/abs/1903.10676

  # ---- clinical encoders added after the sheet (2026-10-26), to fill the clinical rung ----
  - id: bio-clinicalbert
    hf: emilyalsentzer/Bio_ClinicalBERT
    org: MIT / Alsentzer et al.
    year: 2019
    domain: clinical
    role: classifier
    max_len: 512
    paper: "Publicly Available Clinical BERT Embeddings"
    paper_url: https://arxiv.org/abs/1904.03323
    note: BioBERT further pre-trained on MIMIC-III notes. MIT licence.

  - id: gatortron-base
    hf: UFNLP/gatortron-base
    org: University of Florida / NVIDIA
    year: 2022
    domain: clinical
    role: classifier
    max_len: 512
    paper: "A large language model for electronic health records (GatorTron)"
    paper_url: https://doi.org/10.1038/s41746-022-00742-2
    note: Megatron-BERT, 345M parameters, pre-trained on 82B words of de-identified clinical notes. Apache-2.0.

  - id: biomedbert
    hf: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
    org: Microsoft
    year: 2020
    domain: biomedical
    role: classifier
    max_len: 512
    paper: "Domain-Specific Language Model Pretraining for Biomedical Natural Language Processing"
    paper_url: https://arxiv.org/abs/2007.15779
    note: Formerly PubMedBERT.

  - id: sapbert
    hf: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
    org: University of Cambridge
    year: 2021
    domain: biomedical
    role: entity_linking
    max_len: 512
    paper: "Self-Alignment Pretraining for Biomedical Entity Representations"
    paper_url: https://arxiv.org/abs/2010.11784
    note: >
      Trained for UMLS synonym alignment. Best use here is mapping note terms
      (e.g. "perio", "BOP", "SRP") to SNOMED/UMLS concepts for the OMOP
      NOTE_NLP and SITE_EVENT tables. Can also be fine-tuned as a classifier
      for comparison, but that is not its design.

  # ---- clinical ------------------------------------------------------------
  - id: bioclinical-modernbert-base
    hf: thomas-sounack/BioClinical-ModernBERT-base
    org: Thomas Sounack, Dana-Farber Cancer Institute
    year: 2025
    domain: clinical
    role: long_context
    max_len: 8192
    paper: "BioClinical ModernBERT: A State-of-the-Art Long-Context Encoder for Biomedical and Clinical NLP"
    paper_url: https://arxiv.org/abs/2506.10896

  - id: bioclinical-modernbert-large
    hf: thomas-sounack/BioClinical-ModernBERT-large
    org: Thomas Sounack, Dana-Farber Cancer Institute
    year: 2025
    domain: clinical
    role: long_context
    max_len: 8192
    paper: "BioClinical ModernBERT (large)"
    paper_url: https://arxiv.org/abs/2506.10896

  - id: clinical-longformer
    hf: yikuan8/Clinical-Longformer
    org: Northwestern University, Yuan Luo Lab
    year: 2022
    domain: clinical
    role: long_context
    max_len: 4096
    paper: "Clinical-Longformer and Clinical-BigBird: Transformers for long clinical sequences"
    paper_url: https://arxiv.org/abs/2201.11838

  # ---- retrieval -----------------------------------------------------------
  - id: gte-moderncolbert
    hf: lightonai/GTE-ModernColBERT-v1
    org: LightOn
    year: 2025
    domain: general
    role: retrieval
    max_len: 8192
    paper: "GTE-ModernColBERT (late-interaction retriever built on ModernBERT)"
    note: >
      Not a classifier. Keep it for the evidence-retrieval step (find the
      chart lines that support a status) or for a RAG rung where the LLM is
      the classifier. Score it on retrieval metrics, not F1 on perio status.

  # ---- medical LLMs (exploratory; see docs/medgemma.md) ---------------------
  # Run as note-reader rungs by llm_reader.py (spec 004):
  #   python scripts/11_ai_predict.py --rung medgemma-1.5-4b-it --backend hf
  # Accept the HAI-DEF terms on Hugging Face before downloading. `family` is used
  # by the judge bake-off: a judge of the same family is not selected.
  - id: medgemma-1.5-4b-it
    hf: google/medgemma-1.5-4b-it
    org: Google (Health AI Developer Foundations)
    year: 2026
    domain: medical
    role: llm
    family: gemma
    modality: multimodal
    max_len: 128000
    paper: "MedGemma Technical Report (arXiv 2507.05201); MedGemma 1.5 release, Jan 2026"
    paper_url: https://arxiv.org/abs/2507.05201
    note: Newer 4B; better document/EHR extraction reported. Default reader to try first.

  - id: medgemma-4b-it
    hf: google/medgemma-4b-it
    org: Google (Health AI Developer Foundations)
    year: 2025
    domain: medical
    role: llm
    family: gemma
    modality: multimodal
    max_len: 128000
    paper: "MedGemma Technical Report (arXiv 2507.05201)"
    paper_url: https://arxiv.org/abs/2507.05201
    note: Multimodal (text + image). Candidate zero-shot reader, LoRA fine-tune, judge, paraphraser.

  - id: medgemma-27b-text-it
    hf: google/medgemma-27b-text-it
    org: Google (Health AI Developer Foundations)
    year: 2025
    domain: medical
    role: llm
    family: gemma
    modality: text
    max_len: 128000
    paper: "MedGemma Technical Report (arXiv 2507.05201)"
    paper_url: https://arxiv.org/abs/2507.05201
    note: Text only. Candidate zero-shot reader and judge.

# ---- benchmark groupings ---------------------------------------------------
ladders:
  # Rung order for the headline comparison. Same test split for every rung.
  classification:
    - note_rules                # stated dx in any scheme, else findings (clinical notes)
    - rules_baseline            # regex + shorthand expansion, no model (templated notes)
    - structured_baseline       # logistic regression on chart numerics only
    - tfidf_logreg              # TF-IDF + logistic regression on the text
    - fusion_tfidf_rad          # TF-IDF text + structured radiograph AI features (spec 003)
    - distilbert-base
    - bert-base
    - scibert
    - biomedbert
    - modernbert-base
    - bioclinical-modernbert-base
    - modernbert-large
    - bioclinical-modernbert-large
    - llm_challenger            # large LLM, zero/few-shot, served on Databricks
  long_context:
    # Only matters if the input is a multi-visit chart rather than one note.
    - longformer-base
    - clinical-longformer
    - modernbert-base
    - bioclinical-modernbert-base
  concept_mapping:
    - sapbert
  retrieval:
    - gte-moderncolbert
  llm_challengers:
    # exploratory note readers (llm_reader.py, spec 004)
    - medgemma-1.5-4b-it
    - medgemma-4b-it
    - medgemma-27b-text-it

# ---- shared settings ---------------------------------------------------------
eval:
  split: by_patient
  metrics: [macro_f1, per_class_f1, sensitivity, specificity, auroc]
  primary: sensitivity           # screening use: the miss is the costly error
  labels: [healthy, gingivitis, periodontitis_stage_1, periodontitis_stage_2, periodontitis_stage_3, periodontitis_stage_4]
  label_source: synthetic_perio_chart   # replaced by clinician protocol later
