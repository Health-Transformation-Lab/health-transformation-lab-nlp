# Can GitHub sign in as the environment's service principal? Run by hand before the first deploy;
# it prints the principal's application id (docs/deployment.md).
name: Check Databricks sign-in for an environment
on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub environment
        type: choice
        options: [dev, uat, prod]
        default: uat

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/databricks-signin
        with:
          host: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          client_id: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
          client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - uses: databricks/setup-cli@v0.297.2
      - run: databricks current-user me
