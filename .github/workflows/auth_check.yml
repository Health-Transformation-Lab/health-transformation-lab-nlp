# Test that GitHub can log in to Databricks as the CI robot account (service principal dental-omop-ci)
# with the secret stored in a GitHub environment (dev, uat or prod). Deploys nothing; prints which
# account it logged in as. Run it by hand after creating or replacing that secret (docs/deployment.md).
name: Test that GitHub can log in to Databricks (before a first deploy)
on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub environment
        type: choice
        options: [dev, uat, prod]
        default: dev

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/databricks-signin
        with:
          host: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          client_id: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
          client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - uses: databricks/setup-cli@v0.297.2
      - run: databricks current-user me
