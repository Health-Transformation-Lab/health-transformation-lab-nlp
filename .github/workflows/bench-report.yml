# The report app (spec 029, bench-report/): Python tests on the snapshot of the gold tables, front-end tests and the
# type-checked build. No workspace and no secret: everything runs on the committed snapshot.
name: Test the report app (bench-report)
on:
  push:
    branches: [main]
    paths: ["bench-report/**", ".github/workflows/bench-report.yml"]
  pull_request:
    paths: ["bench-report/**", ".github/workflows/bench-report.yml"]
  workflow_dispatch:

concurrency:
  group: bench-report-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: bench-report/pyproject.toml}
      - run: pip install -e "./bench-report[dev]"
      - run: cd bench-report && pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: bench-report/web}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: bench-report/web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
