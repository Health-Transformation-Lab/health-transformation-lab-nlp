# Tests on every push and pull request: Python tests (incl. bundle structure),
# R parity, and the bundle against its schema.
name: Test every change (Python, R parity, bundle)
# Changes that touch only docs (docs/, any .md, diagrams) skip CI: nothing they change is tested.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "diagrams/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "diagrams/**"]
  workflow_dispatch:      # Actions -> ci -> Run workflow: rerun the checks on any branch by hand

# A new push to the same PR cancels the run still going for the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: python/pyproject.toml}
      - run: pip install -e "./python[dev,track,azure,ml]" matplotlib
      - run: cd python && pytest -q tests

  postgres:
    # OMOP CDM 5.4 + dental extension on Postgres (Lakebase is managed Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DENTAL_TEST_DB_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: python/pyproject.toml}
      - run: pip install -e "./python[dev,db]"
      - run: cd python && python scripts/01_build_dataset.py && pytest -q tests/test_db_postgres.py tests/test_site_designs.py

  r-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: python/pyproject.toml}
      - uses: r-lib/actions/setup-r@v2   # base R only: test_parity.R installs no packages
      - run: pip install -e "./python[dev]" matplotlib
      - name: Regenerate the Python outputs parity compares against
        run: python/scripts/make_parity_inputs.sh
      - run: Rscript r/tests/test_parity.R

  azure-infra:
    # Check the telemetry Terraform (spec 014): formatting, then validate without a backend or Azure sign-in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/azure fmt -check -recursive
      - run: terraform -chdir=infra/azure init -backend=false && terraform -chdir=infra/azure validate

  bundle:
    # Validate needs a workspace; runs only once dev has the service principal's secret.
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/databricks-signin
        with:
          host: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          client_id: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
          client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - uses: databricks/setup-cli@v0.297.2   # >= 0.288 for the catalogs resource
      - name: bundle validate (all targets)
        if: env.DATABRICKS_CLIENT_SECRET != ''
        run: for t in dev uat prod; do databricks bundle validate -t $t; done
