# Run the MedGemma reader on a free Kaggle GPU (kaggle/medgemma_reader.ipynb), for when Databricks
# Free Edition has no GPU. Start it from the Actions tab: "kaggle-medgemma" -> Run workflow.
#
# Needs, in the GitHub environment `dev`: KAGGLE_USERNAME (variable or secret) and either KAGGLE_API_TOKEN
# or KAGGLE_KEY (secret). The Hugging Face token is NOT passed from here: attach it once on kaggle.com
# (open the notebook, Add-ons -> Secrets -> HF_TOKEN); the first run without it stops with that message.
name: kaggle-medgemma

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Review notes to read: 10 for a test, 0 for all 240 (a few hours: set wait off)"
        default: "10"
      shots:
        description: "Few-shot examples per status (0 = zero-shot)"
        default: "0"
      rung:
        description: "MedGemma version (models.yaml)"
        default: medgemma-1.5-4b-it
      branch:
        description: "Branch the notebook clones"
        default: main
      wait:
        description: "Wait for Kaggle to finish and keep the outputs as an artifact"
        type: boolean
        default: true
      collect_only:
        description: "Don't run: only download the outputs of the last Kaggle run"
        type: boolean
        default: false

concurrency: kaggle-medgemma

jobs:
  run:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --quiet "kaggle==2.2.5"

      - name: Kaggle credentials (values stay masked)
        env:
          U: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
          T: ${{ secrets.KAGGLE_API_TOKEN }}
          K: ${{ secrets.KAGGLE_KEY }}
        run: |
          [ -n "$U" ] || { echo "::error::KAGGLE_USERNAME is not set in the GitHub environment 'dev' (variable or secret)"; exit 1; }
          echo "KAGGLE_USERNAME=$U" >> "$GITHUB_ENV"
          # Kaggle's "Generate New Token" makes an API token (KAGGLE_API_TOKEN); older accounts have a legacy key
          # (KAGGLE_KEY). A token saved under KAGGLE_KEY works too: the CLI tries it as a token first and falls
          # back to username + key if Kaggle doesn't recognise it.
          tok="${T:-$K}"
          [ -n "$tok" ] || { echo "::error::Set KAGGLE_API_TOKEN (or KAGGLE_KEY) in the GitHub environment 'dev'"; exit 1; }
          echo "KAGGLE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          [ -n "$K" ] && echo "KAGGLE_KEY=$K" >> "$GITHUB_ENV"
          echo "KERNEL=$U/dental-omop-medgemma-reader" >> "$GITHUB_ENV"

      - name: Check Kaggle accepts the credentials
        run: |
          kaggle kernels list --mine --page-size 1 >/dev/null 2>err.txt || {
            cat err.txt | head -5
            echo "::error::Kaggle rejected the credentials. Kaggle -> Settings -> API -> Generate New Token, save it as the secret KAGGLE_API_TOKEN in the GitHub environment 'dev', and check KAGGLE_USERNAME is your Kaggle username (the name in kaggle.com/<username>), not your email."
            exit 1; }
          echo "Kaggle accepted the credentials"

      - name: Prepare the notebook
        if: ${{ !inputs.collect_only }}
        run: >
          python kaggle/prepare_kernel.py --out build/kernel --username "$KAGGLE_USERNAME"
          --rung "${{ inputs.rung }}" --shots "${{ inputs.shots }}" --limit "${{ inputs.limit }}"
          --branch "${{ inputs.branch }}"

      - name: Push and run it on Kaggle (GPU T4 x2)
        if: ${{ !inputs.collect_only }}
        run: kaggle kernels push -p build/kernel --accelerator NvidiaTeslaT4

      - name: Wait for Kaggle to finish
        if: ${{ inputs.wait || inputs.collect_only }}
        run: |
          for i in $(seq 1 330); do
            s=$(kaggle kernels status "$KERNEL" 2>&1); echo "$(date -u +%H:%M) $s"
            case "${s,,}" in
              *complete*) exit 0 ;;
              *error*|*cancel*) echo "::error::Kaggle run did not finish: $s"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::still running after 330 minutes; run again later with collect_only"; exit 1

      - name: Download the outputs and the log
        if: ${{ always() && (inputs.wait || inputs.collect_only) }}
        run: |
          mkdir -p build/output
          kaggle kernels output "$KERNEL" -p build/output || true
          ls -la build/output
          log=$(ls build/output/*.log 2>/dev/null | head -1)
          if [ -n "$log" ]; then echo "---- end of the Kaggle log (warnings left out) ----"; python kaggle/show_log.py "$log"; fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.wait || inputs.collect_only) }}
        with:
          name: medgemma-${{ inputs.rung }}-kaggle
          path: build/output
          if-no-files-found: warn
